<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">Liverpool, in detail.</title><desc id="desc">Red Half Lab: a Liverpool supporter’s independent data project. An illustrated pitch connects team match dominance, player passing and progression, and goalkeeper threats to REDS reports. Match Pulse is a separate research project.</desc><defs><pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".45" fill="#fff" opacity=".12"/><circle cx="5" cy="4" r=".5" fill="#000" opacity=".14"/></pattern></defs><rect x="0" y="0" width="1440" height="1080" fill="#480a19" /><path d="M1100 0h340v790H890Z" fill="#8b1231"/><rect x="0" y="0" width="1440" height="790" fill="url(#grain)" /><rect x="64" y="42" width="58" height="58" fill="#f6f3ed" /><g transform="translate(69 46)"><svg class="logo" width="48" height="48" viewBox="0 0 96 96" aria-hidden="true"><path d="M22 6H74A10 10 0 0 1 84 16V72H12V16A10 10 0 0 1 22 6Z" fill="#c8102e"/><path d="M12 70h8v18a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zM24.8 70h8v18a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zM37.6 70h8v18a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zM50.4 70h8v18a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zM63.2 70h8v18a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zM76 70h8v18a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2z" fill="#c8102e"/><path d="M12 18H84V29H12zM12 37H56V48H12zM12 56H70V67H12z" fill="#fff"/></svg></g><text x="141" y="78" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#f6f3ed" letter-spacing="3">RED HALF LAB</text><text x="1376" y="77" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#edb6c1" text-anchor="end" letter-spacing="2">INDEPENDENT FOOTBALL RESEARCH</text><path d="M64 124L1376 124" stroke="#a34e65" stroke-width="1" fill="none" /><text x="64" y="192" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#edb6c1" letter-spacing="3">A LIVERPOOL SUPPORTER’S DATA PROJECT</text><text x="57" y="377" font-family="DIN Condensed, Impact, sans-serif" font-size="171" font-weight="700" fill="#f6f3ed">LIVERPOOL.</text><text x="57" y="529" font-family="DIN Condensed, Impact, sans-serif" font-size="171" font-weight="700" fill="#f6f3ed">IN DETAIL.</text><text x="66" y="605" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f6f3ed" >Match forecasts and player comparisons,</text><text x="66" y="645.6" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#f6f3ed" >explained for Liverpool supporters.</text><path d="M66 697L112 697" stroke="#bce6d8" stroke-width="3" fill="none" /><text x="128" y="706" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#edb6c1" >Understand the team. Look closer at the player.</text><ellipse cx="1070" cy="437" rx="190" ry="271" transform="rotate(18 1070 437)" fill="none" stroke="#e399ab" stroke-opacity="0.12" stroke-width="1"/><ellipse cx="1070" cy="437" rx="226" ry="296" transform="rotate(18 1070 437)" fill="none" stroke="#e399ab" stroke-opacity="0.107" stroke-width="1"/><ellipse cx="1070" cy="437" rx="262" ry="321" transform="rotate(18 1070 437)" fill="none" stroke="#e399ab" stroke-opacity="0.094" stroke-width="1"/><ellipse cx="1070" cy="437" rx="298" ry="346" transform="rotate(18 1070 437)" fill="none" stroke="#e399ab" stroke-opacity="0.08099999999999999" stroke-width="1"/><ellipse cx="1070" cy="437" rx="334" ry="371" transform="rotate(18 1070 437)" fill="none" stroke="#e399ab" stroke-opacity="0.068" stroke-width="1"/><ellipse cx="1070" cy="437" rx="370" ry="396" transform="rotate(18 1070 437)" fill="none" stroke="#e399ab" stroke-opacity="0.05499999999999999" stroke-width="1"/><g transform="translate(880 216) rotate(18 186 232)"><rect x="0" y="0" width="372" height="464" fill="#6c152c" stroke="#edb6c1" stroke-width="2"/><p