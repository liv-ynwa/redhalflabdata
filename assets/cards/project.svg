size="22" font-weight="600" fill="#f6f3ed" >Passing + progression</text><path d="M968 621L1110 670" stroke="#edb6c1" stroke-width="1" fill="none" /><rect x="1084" y="651" width="303" height="76" fill="#480a19" stroke="#ad5d72" stroke-width="1"/><rect x="1084" y="651" width="4" height="76" fill="#bce6d8" /><text x="1102" y="676" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#edb6c1" letter-spacing="2">THE GOALKEEPER</text><text x="1102" y="706" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#f6f3ed" >Threat + interventions</text><text x="802" y="747" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#edb6c1" letter-spacing="2">REPORT COVERAGE / SCHEMATIC</text><rect x="0" y="790" width="1440" height="290" fill="#f6f3ed" /><rect x="64" y="830" width="5" height="166" fill="#c8102e" /><text x="95" y="881" font-family="DIN Condensed, Impact, sans-serif" font-size="48" font-weight="700" fill="#c8102e">REDS</text><text x="95" y="924" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#201b1d" >Next-match reports and wider fan questions.</text><text x="95" y="957.75" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#201b1d" >Explore team performance, player roles</text><text x="95" y="991.5" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#201b1d" >and individual contributions.</text><path d="M733 835L733 991" stroke="#d2c2c5" stroke-width="1" fill="none" /><text x="773" y="881" font-family="DIN Condensed, Impact, sans-serif" font-size="48" font-weight="700" fill="#c8102e">MATCH PULSE</text><text x="773" y="924" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#201b1d" >Research into form, cards and match style.</text><text x="773" y="957.75" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#201b1d" >The public tracker shares aggregate progress;</text><text x="773" y="991.5" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#201b1d" >individual match forecasts remain private.</text><path d="M64 1020L1376 1020" stroke="#d2c2c5" stroke-width="1" fill="none" /><text x="64" y="1056" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#201b1d" >redhalflab.com</text><text x="1376" y="1054" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6d5c61" text-anchor="end">Models still developing · Independent of Liverpool FC</text></svg>