d8ea2" stroke-width="2" fill="none"/><circle cx="221" cy="169" r="58" fill="none" stroke="#dd8ea2" stroke-width="2"/><path d="M63 208h68l25-61 46 104 37-82h90" fill="none" stroke="#bce6d8" stroke-width="4"/><circle cx="63" cy="208" r="6" fill="#bce6d8" stroke="none" stroke-width="1"/><circle cx="329" cy="169" r="6" fill="#bce6d8" stroke="none" stroke-width="1"/></g><g transform="rotate(-13 1048 325)"><rect x="942" y="214" width="104" height="146" fill="#e9c571" rx="5"/><rect x="1020" y="247" width="104" height="146" fill="#c8102e" rx="5"/></g><rect x="1046" y="171" width="339" height="76" fill="#480a19" stroke="#ad5d72" stroke-width="1"/><rect x="1046" y="171" width="4" height="76" fill="#bce6d8" /><text x="1064" y="196" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#edb6c1" letter-spacing="2">DISCIPLINE</text><text x="1064" y="226" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#f6f3ed" >Red + yellow cards</text><rect x="796" y="513" width="337" height="76" fill="#480a19" stroke="#ad5d72" stroke-width="1"/><rect x="796" y="513" width="4" height="76" fill="#bce6d8" /><text x="814" y="538" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#edb6c1" letter-spacing="2">FORM</text><text x="814" y="568" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#f6f3ed" >One-match + three-match</text><rect x="1070" y="651" width="315" height="76" fill="#480a19" stroke="#ad5d72" stroke-width="1"/><rect x="1070" y="651" width="4" height="76" fill="#bce6d8" /><text x="1088" y="676" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#edb6c1" letter-spacing="2">MATCH STYLE</text><text x="1088" y="706" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#f6f3ed" >Patterns of play</text><text x="802" y="747" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#edb6c1" letter-spacing="2">RESEARCH TOPICS / ILLUSTRATION</text><rect x="0" y="790" width="1440" height="290" fill="#f6f3ed" /><rect x="64" y="830" width="5" height="166" fill="#c8102e" /><path d="M733 835L733 991" stroke="#d2c2c5" stroke-width="1" fill="none" /><path d="M64 1020L1376 1020" stroke="#d2c2c5" stroke-width="1" fill="none" /><text x="95" y="881" font-family="DIN Condensed, Impact, sans-serif" font-size="43" font-weight="700" fill="#c8102e">WHAT IS PUBLIC</text><text x="95" y="924" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#201b1d" >Dated aggregate research snapshots.</text><text x="95" y="957.6" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#201b1d" >Historical baseline comparisons and</text><text x="95" y="991.2" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#201b1d" >genuine pre-match check counts.</text><text x="773" y="881" font-family="DIN Condensed, Impact, sans-serif" font-size="43" font-weight="700" fill="#c8102e">WHAT IS STILL BEING TESTED</text><text x="773" y="924" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#201b1d" >Historical replays are separate from live records.</text><text x="773" y="957.6" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#201b1d" >Live reliability is not established.</text><text x="773" y="991.2" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#201b1d" >Individual match forecasts remain private.</text><text x="64" y="1056" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#201b1d" >redhalflab.com/research/match-pulse</text><text x="1376" y="1054" font-family="Avenir Next, Avenir, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#6d5c61" text-anchor="end">Research in progress · Independent of Liverpool FC</text></svg>